name: Sync main to production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sync-main-to-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create production sync token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PRODUCTION_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRODUCTION_SYNC_APP_PRIVATE_KEY }}
          repositories: dba-database
          permission-contents: write

      - name: Fast-forward production to main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          production_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/production" --jq '.object.sha')

          if [ "$production_sha" = "$SOURCE_SHA" ]; then
            echo "production already points to $SOURCE_SHA"
            exit 0
          fi

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/production" \
            --field sha="$SOURCE_SHA" \
            --field force=false
